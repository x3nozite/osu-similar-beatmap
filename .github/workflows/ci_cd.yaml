name: Docker demo
run-name: Testing out github actions for building docker image
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-img:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{github.ref == 'refs/heads/main'}}
          tags: |
            xenozite/osu-similarity-backend:latest
            xenozite/osu-similarity-backend:${{ github.sha }}
      -
        name: build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{github.ref == 'refs/heads/main'}}
          tags: |
            xenozite/osu-similarity-frontend:latest
            xenozite/osu-similarity-frontend:${{ github.sha }}
